name: Deploy Server on Self-Hosted Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "go.mod"
      - "go.sum"
      - "scripts/deploy-self-hosted.sh"
      - ".github/workflows/deploy-self-hosted.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "go.mod"
      - "go.sum"
      - "scripts/deploy-self-hosted.sh"
      - ".github/workflows/deploy-self-hosted.yml"

permissions:
  contents: read

concurrency:
  group: vrtraining-server-self-hosted-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and run Docker stack
    runs-on: [self-hosted]
    timeout-minutes: 30

    env:
      APP_ENV: production
      SERVER_PORT: 8080
      POSTGRES_DB: vrtraining
      POSTGRES_USER: vrtraining
      POSTGRES_PASSWORD: ${{ secrets.VRTRAINING_POSTGRES_PASSWORD }}
      DATABASE_URL: ${{ secrets.VRTRAINING_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.VRTRAINING_JWT_SECRET }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.VRTRAINING_CORS_ALLOWED_ORIGINS }}
      REPORT_STORAGE_PATH: /app/reports
      MIGRATIONS_PATH: /app/migrations
      LOG_LEVEL: info
      COMPOSE_PROJECT_NAME: vrtraining

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required environment
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in POSTGRES_PASSWORD DATABASE_URL JWT_SECRET CORS_ALLOWED_ORIGINS; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Missing required environment value: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Set these GitHub Actions secrets: VRTRAINING_POSTGRES_PASSWORD, VRTRAINING_DATABASE_URL, VRTRAINING_JWT_SECRET, VRTRAINING_CORS_ALLOWED_ORIGINS" >&2
            exit 1
          fi

      - name: Show Docker versions
        shell: bash
        run: |
          docker --version
          docker compose version

      - name: Build and run Docker Compose stack
        shell: bash
        run: |
          chmod +x scripts/deploy-self-hosted.sh
          scripts/deploy-self-hosted.sh
