name: Deploy Server on Self-Hosted Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "go.mod"
      - "go.sum"
      - "scripts/deploy-self-hosted.sh"
      - ".github/workflows/deploy-self-hosted.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "go.mod"
      - "go.sum"
      - "scripts/deploy-self-hosted.sh"
      - ".github/workflows/deploy-self-hosted.yml"

permissions:
  contents: read

concurrency:
  group: vrtraining-server-self-hosted-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and run Docker stack
    runs-on: [self-hosted]
    timeout-minutes: 30

    env:
      APP_ENV: production
      SERVER_PORT: 8080
      POSTGRES_DB: vrtraining
      POSTGRES_USER: vrtraining
      POSTGRES_PASSWORD: ${{ secrets.VRTRAINING_POSTGRES_PASSWORD }}
      DATABASE_URL: ${{ secrets.VRTRAINING_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.VRTRAINING_JWT_SECRET }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.VRTRAINING_CORS_ALLOWED_ORIGINS }}
      REPORT_STORAGE_PATH: /app/reports
      MIGRATIONS_PATH: /app/migrations
      LOG_LEVEL: info
      COMPOSE_PROJECT_NAME: vrtraining

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner and Docker versions
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS: ${RUNNER_OS:-unknown}"
          echo "Workspace: ${GITHUB_WORKSPACE:-unknown}"
          docker --version
          docker compose version

      - name: Build and run Docker Compose stack
        shell: bash
        run: |
          chmod +x scripts/deploy-self-hosted.sh
          scripts/deploy-self-hosted.sh
