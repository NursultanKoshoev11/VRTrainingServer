name: Windows Docker

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "scripts/deploy-self-hosted.ps1"
      - ".github/workflows/windows-docker.yml"

permissions:
  contents: read

jobs:
  run:
    name: Run Docker stack on Windows runner
    runs-on: [self-hosted]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run stack
        shell: powershell
        run: .\scripts\deploy-self-hosted.ps1
