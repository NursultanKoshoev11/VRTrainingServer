services:
  postgres:
    image: postgres:16-alpine
    container_name: vrtraining-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vrtraining}
      POSTGRES_USER: ${POSTGRES_USER:-vrtraining}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vrtraining} -d ${POSTGRES_DB:-vrtraining}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vrtraining-server:local
    container_name: vrtraining-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://vrtraining:change_this_password@postgres:5432/vrtraining?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      REPORT_STORAGE_PATH: ${REPORT_STORAGE_PATH:-/app/reports}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    volumes:
      - reports_data:/app/reports
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  reports_data:
